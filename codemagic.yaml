workflows:
  android-apk:
    name: Sammridhi Finance APK
    environment:
      java: 17
    scripts:
      - name: Extract Android project
        script: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          unzip -q "$ZIP" -d project

      - name: Build APK
        script: |
          cd project
          ROOT=$(find . -name settings.gradle.kts -o -name settings.gradle | head -1)
          ROOT=$(dirname "$ROOT")
          cd "$ROOT"
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - project/**/build/outputs/apk/debug/*.apk
