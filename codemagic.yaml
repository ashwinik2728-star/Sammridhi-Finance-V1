workflows:
  android-apk:
    name: Sammridhi Finance APK
    environment:
      java: 17
    scripts:
      - name: Extract Android project
        script: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          unzip -q "$ZIP" -d project

      - name: Build APK
        script: |
          ROOT=$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)
          ROOT=$(dirname "$ROOT")
          cd "$ROOT"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

    artifacts:
      - project/**/build/outputs/apk/debug/*.apk
